<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-weight="bold" fill="#1e293b">Event.state の遷移 — マイナスが終了、プラスが進行中〜正常</text>

  <!-- 募集中 -->
  <rect x="80" y="100" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="127" text-anchor="middle" font-weight="bold" fill="#166534">募集中</text>
  <text x="180" y="147" text-anchor="middle" font-size="10" fill="#166534">IS_RECRUITING（100）</text>

  <!-- 成立 -->
  <rect x="620" y="100" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="720" y="127" text-anchor="middle" font-weight="bold" fill="#166534">成立</text>
  <text x="720" y="147" text-anchor="middle" font-size="10" fill="#166534">IS_CONFIRMED（200）</text>

  <!-- 流れた -->
  <rect x="200" y="300" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="327" text-anchor="middle" font-weight="bold" fill="#991b1b">流れた</text>
  <text x="300" y="347" text-anchor="middle" font-size="10" fill="#991b1b">IS_FAILED（-100）</text>

  <!-- 取り消された -->
  <rect x="560" y="300" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="327" text-anchor="middle" font-weight="bold" fill="#991b1b">取り消された</text>
  <text x="660" y="347" text-anchor="middle" font-size="10" fill="#991b1b">IS_CANCELED（-200）</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 募集中 → 成立 -->
  <path d="M280,132 H612" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="112" text-anchor="middle" font-size="11" fill="#334155">参加者数が成立人数に達した（成立を投稿）</text>

  <!-- 募集中 → 流れた -->
  <path d="M160,164 V292" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="150" y="230" text-anchor="end" font-size="11" fill="#334155">開始時刻が来ても</text>
  <text x="150" y="246" text-anchor="end" font-size="11" fill="#334155">成立しなかった（流れたを投稿）</text>

  <!-- 成立 → 流れた -->
  <path d="M650,164 L370,296" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="460" y="222" text-anchor="middle" font-size="11" fill="#334155">開示前の取り消しで</text>
  <text x="460" y="238" text-anchor="middle" font-size="11" fill="#334155">人数割れ（流れたを投稿）</text>

  <!-- 成立 → 取り消された / 募集中 → 取り消された -->
  <path d="M740,164 V292" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M255,164 L590,300" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="742" y="230" text-anchor="start" font-size="11" fill="#334155">開示前に立案者が</text>
  <text x="742" y="246" text-anchor="start" font-size="11" fill="#334155">参加を取り消した</text>
  <text x="742" y="262" text-anchor="start" font-size="11" fill="#334155">（取り消されたを投稿）</text>

  <!-- 注記 -->
  <rect x="60" y="386" width="780" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="403" font-size="10.5" fill="#475569">・確定型（成立人数1）は作成の瞬間から「成立」で始まる　・成立のまま開始時刻を過ぎたら開催とみなす（状態は変えない）</text>
  <text x="76" y="420" font-size="10.5" fill="#475569">・開示より後は、人数が割れても・0人になっても「成立」のまま（表示だけ変わる）　・流れた／取り消されたには時刻が来ても何もしない</text>
</svg>
