<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="980" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="1240" height="680" fill="#ffffff"/>

  <text x="620" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b">ER 図 — Osasoi 全体のデータの繋がり</text>

  <!-- ===================== udb ===================== -->
  <rect x="30" y="60" width="250" height="190" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="46" y="81" font-size="11" font-weight="bold" fill="#64748b">udb（会員・認証）</text>

  <!-- 会員 -->
  <rect x="50" y="100" width="210" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="50" y="100" width="210" height="34" rx="6" fill="#16a34a"/>
  <text x="64" y="116" font-size="12" font-weight="bold" fill="#ffffff">会員</text>
  <text x="64" y="129" font-size="9" fill="#dcfce7">User</text>
  <text x="248" y="116" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="64" y="156" font-size="10.5" fill="#334155">会員 ID / 公開用 UUID</text>
  <text x="64" y="175" font-size="10.5" fill="#334155">ログイン ID（email）</text>
  <text x="64" y="194" font-size="10.5" fill="#334155">表示名（開示で見える名前）</text>
  <text x="64" y="213" font-size="10.5" fill="#334155">状態</text>

  <!-- ===================== event ===================== -->
  <rect x="330" y="60" width="400" height="400" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="346" y="81" font-size="11" font-weight="bold" fill="#64748b">event（誘い。今回新設するコンテキスト）</text>

  <!-- イベント -->
  <rect x="360" y="100" width="340" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="360" y="100" width="340" height="34" rx="6" fill="#16a34a"/>
  <text x="374" y="116" font-size="12" font-weight="bold" fill="#ffffff">イベント</text>
  <text x="374" y="129" font-size="9" fill="#dcfce7">Event</text>
  <text x="688" y="116" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="374" y="156" font-size="10.5" fill="#334155">イベント ID / 公開用 UUID / 内容</text>
  <text x="374" y="175" font-size="10.5" fill="#334155">場所（自由記述 or 店 ID・任意）/ 立案者 ID</text>
  <text x="374" y="194" font-size="10.5" fill="#334155">成立人数（1 なら確定型）</text>
  <text x="374" y="213" font-size="10.5" fill="#334155">開始時刻（開催日含む）/ 開示タイミング</text>
  <text x="374" y="232" font-size="10.5" fill="#334155">状態（募集中/成立/流れた/取り消された）</text>

  <!-- 参加 -->
  <rect x="360" y="320" width="340" height="110" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="360" y="320" width="340" height="34" rx="6" fill="#16a34a"/>
  <text x="374" y="336" font-size="12" font-weight="bold" fill="#ffffff">参加</text>
  <text x="374" y="349" font-size="9" fill="#dcfce7">EventEntry</text>
  <text x="688" y="336" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="374" y="376" font-size="10.5" fill="#334155">参加 ID / イベント ID / 会員 ID</text>
  <text x="374" y="395" font-size="10.5" fill="#334155">コメント（任意。開示まで見せない）</text>
  <text x="374" y="414" font-size="10.5" fill="#334155">取り消し日時（None なら有効。押し直しは新行）</text>

  <!-- ===================== shop ===================== -->
  <rect x="780" y="60" width="430" height="400" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="796" y="81" font-size="11" font-weight="bold" fill="#64748b">shop（お店。今回新設するコンテキスト）</text>

  <!-- 店 -->
  <rect x="810" y="100" width="370" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="810" y="100" width="370" height="34" rx="6" fill="#16a34a"/>
  <text x="824" y="116" font-size="12" font-weight="bold" fill="#ffffff">店</text>
  <text x="824" y="129" font-size="9" fill="#dcfce7">Shop</text>
  <text x="1168" y="116" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="824" y="156" font-size="10.5" fill="#334155">店 ID / 相手側 ID（手で足した店は無し）</text>
  <text x="824" y="175" font-size="10.5" fill="#334155">店名</text>
  <text x="824" y="194" font-size="10.5" fill="#334155">緯度・経度（任意）</text>
  <text x="824" y="213" font-size="10.5" fill="#334155">場所メモ（任意。手で足した店の目印）</text>

  <!-- 評価 -->
  <rect x="810" y="320" width="370" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="810" y="320" width="370" height="34" rx="6" fill="#16a34a"/>
  <text x="824" y="336" font-size="12" font-weight="bold" fill="#ffffff">評価</text>
  <text x="824" y="349" font-size="9" fill="#dcfce7">ShopReview</text>
  <text x="1168" y="336" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="824" y="376" font-size="10.5" fill="#334155">評価 ID / 店 ID / 会員 ID</text>
  <text x="824" y="395" font-size="10.5" fill="#334155">3段階（また行きたい/ふつう/いまいち）</text>
  <text x="824" y="414" font-size="10.5" fill="#334155">時間帯（任意）/ 並んだか（任意）</text>
  <text x="824" y="433" font-size="10.5" fill="#334155">一言（任意・記名で常時表示）</text>

  <!-- 会員 1 : * イベント（立案者として） -->
  <path d="M260,145 H360" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="272" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="348" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>
  <text x="310" y="137" text-anchor="middle" font-size="9.5" fill="#5b21b6">立案者</text>

  <!-- 会員 1 : * 参加 -->
  <path d="M155,230 V375 H360" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="167" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="348" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>

  <!-- イベント 1 : * 参加 -->
  <path d="M530,250 V320" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="542" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="542" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>

  <!-- イベント * : 1 店（場所として選んだ店・任意） -->
  <path d="M700,150 H810" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="712" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>
  <text x="798" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="755" y="130" text-anchor="middle" font-size="9.5" fill="#5b21b6">場所として</text>
  <text x="755" y="167" text-anchor="middle" font-size="9.5" fill="#5b21b6">選んだ店（任意）</text>

  <!-- 店 1 : * 評価 -->
  <path d="M995,230 V320" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="1007" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="1007" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>

  <!-- 会員 1 : * 評価 -->
  <path d="M100,230 V480 H755 V395 H810" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="112" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="798" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>

  <!-- 参照の向き -->
  <text x="330" y="505" font-size="10" fill="#64748b">参照は event → udb・shop → udb・event → shop（場所として選んだ店 ID）の一方向。shop は event を一切知らない。5モデルとも今回作る。</text>

  <!-- ===================== データを持たないもの ===================== -->
  <rect x="30" y="520" width="1180" height="130" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="46" y="542" font-size="11" font-weight="bold" fill="#92400e">データを持たないもの（保存せず、計算・設定で表す）</text>
  <text x="46" y="564" font-size="10.5" fill="#78350f">・参加者数 … 取り消し日時が空（None）の参加を数えて求める（立案者の行も含む）　・開示済み … 成立していて、かつ 現在時刻 ≥ 開始時刻 − 開示タイミング</text>
  <text x="46" y="582" font-size="10.5" fill="#78350f">・確定型 … 成立人数が 1　　・告知先（Slack チャンネル） … 環境変数で持ち、モデルにしない</text>
  <text x="46" y="600" font-size="10.5" fill="#78350f">・また行きたいの人数 … 人数で数える（同じ人の複数評価は最新の1票）　・混雑の声 … 6ヶ月以内・2件以上のときだけ　・時間帯フィルタの結果</text>
  <text x="46" y="618" font-size="10.5" fill="#78350f">・提案の2枠 … また行きたいが多い店／自分がまだ評価していない店（開くたびに導出）</text>
  <text x="46" y="636" font-size="10.5" fill="#78350f">・店マスタの取り込みバッチは無い（店は最初の評価と同時に生まれる）</text>
</svg>
