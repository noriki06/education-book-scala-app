<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 560" width="900" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="1130" height="560" fill="#ffffff"/>

  <text x="565" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b">ER 図 — お誘いまわりのデータの繋がり</text>

  <!-- ===================== udb ===================== -->
  <rect x="30" y="60" width="280" height="180" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="46" y="81" font-size="11" font-weight="bold" fill="#64748b">udb（会員・認証）</text>

  <!-- 会員 -->
  <rect x="60" y="110" width="220" height="110" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="60" y="110" width="220" height="34" rx="6" fill="#16a34a"/>
  <text x="74" y="126" font-size="12" font-weight="bold" fill="#ffffff">会員</text>
  <text x="74" y="139" font-size="9" fill="#dcfce7">User</text>
  <text x="268" y="126" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="74" y="166" font-size="10.5" fill="#334155">会員 ID / 公開用 UUID</text>
  <text x="74" y="185" font-size="10.5" fill="#334155">ログイン ID（email）</text>
  <text x="74" y="204" font-size="10.5" fill="#334155">表示名（開示で見える名前）/ 状態</text>

  <!-- ===================== event ===================== -->
  <rect x="400" y="60" width="470" height="360" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="416" y="81" font-size="11" font-weight="bold" fill="#64748b">event（誘い。今回新設するコンテキスト）</text>

  <!-- イベント -->
  <rect x="430" y="110" width="270" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="430" y="110" width="270" height="34" rx="6" fill="#16a34a"/>
  <text x="444" y="126" font-size="12" font-weight="bold" fill="#ffffff">イベント</text>
  <text x="444" y="139" font-size="9" fill="#dcfce7">Event</text>
  <text x="688" y="126" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="444" y="166" font-size="10.5" fill="#334155">イベント ID / 公開用 UUID / 内容</text>
  <text x="444" y="185" font-size="10.5" fill="#334155">場所（自由記述 or 店 ID・任意）/ 立案者 ID</text>
  <text x="444" y="204" font-size="10.5" fill="#334155">成立人数（1 なら確定型）</text>
  <text x="444" y="223" font-size="10.5" fill="#334155">開始時刻（開催日含む）/ 開示タイミング</text>
  <text x="444" y="242" font-size="10.5" fill="#334155">状態（募集中/成立/流れた/取り消された）</text>

  <!-- 参加 -->
  <rect x="430" y="300" width="270" height="110" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="430" y="300" width="270" height="34" rx="6" fill="#16a34a"/>
  <text x="444" y="316" font-size="12" font-weight="bold" fill="#ffffff">参加</text>
  <text x="444" y="329" font-size="9" fill="#dcfce7">EventEntry</text>
  <text x="688" y="316" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="444" y="356" font-size="10.5" fill="#334155">参加 ID / イベント ID / 会員 ID</text>
  <text x="444" y="375" font-size="10.5" fill="#334155">コメント（任意。開示まで見せない）</text>
  <text x="444" y="394" font-size="10.5" fill="#334155">取り消し日時（None なら有効。押し直しは新行）</text>

  <!-- ===================== shop（参照先スタブ） ===================== -->
  <rect x="900" y="60" width="200" height="170" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="916" y="81" font-size="11" font-weight="bold" fill="#64748b">shop（お店 → er-shop.svg）</text>
  <rect x="920" y="110" width="160" height="90" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="934" y="126" font-size="12" font-weight="bold" fill="#475569">店</text>
  <text x="934" y="139" font-size="9" fill="#94a3b8">Shop</text>
  <text x="934" y="166" font-size="10.5" fill="#64748b">店 ID</text>
  <text x="934" y="185" font-size="10.5" fill="#64748b">（詳細は er-shop.svg）</text>

  <!-- イベント * : 1 店（場所として選んだ店・任意） -->
  <path d="M700,185 H920" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="712" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>
  <text x="908" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="810" y="177" text-anchor="middle" font-size="10" fill="#5b21b6">場所として選んだ店（任意）</text>

  <!-- 会員 1 : * イベント（立案者として） -->
  <path d="M280,155 H430" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="292" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="418" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>
  <text x="355" y="147" text-anchor="middle" font-size="10" fill="#5b21b6">立案者として</text>

  <!-- 会員 1 : * 参加 -->
  <path d="M170,220 V355 H430" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="182" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="418" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>

  <!-- イベント 1 : * 参加 -->
  <path d="M565,260 V300" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="577" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">1</text>
  <text x="577" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">*</text>

  <!-- ===================== データを持たないもの ===================== -->
  <rect x="30" y="440" width="840" height="100" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="46" y="462" font-size="11" font-weight="bold" fill="#92400e">データを持たないもの（保存せず、計算・設定で表す）</text>
  <text x="46" y="484" font-size="10.5" fill="#78350f">・参加者数 … 取り消し日時が空（None）の参加を数えて求める（立案者の行も含む）</text>
  <text x="46" y="502" font-size="10.5" fill="#78350f">・開示済みかどうか … 成立していて、かつ 現在時刻 ≥ 開始時刻 − 開示タイミング　　・確定型 … 成立人数が 1</text>
  <text x="46" y="520" font-size="10.5" fill="#78350f">・告知先（Slack チャンネル） … 環境変数で持ち、モデルにしない</text>

  <!-- 注記 -->
  <text x="46" y="392" font-size="10" fill="#64748b">参照は event → udb と、event → shop（場所として</text>
  <text x="46" y="408" font-size="10" fill="#64748b">選んだ店 ID。→ er-shop.svg）の一方向。3モデルとも今回作る。</text>
</svg>
