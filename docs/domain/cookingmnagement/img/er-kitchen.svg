<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b">ER 図 — 調理管理で触るデータ</text>

  <!-- sales context -->
  <rect x="60" y="70" width="330" height="180" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="76" y="92" font-size="11" font-weight="bold" fill="#64748b">sales（注文）</text>

  <rect x="90" y="106" width="270" height="120" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="90" y="106" width="270" height="34" rx="6" fill="#94a3b8"/>
  <text x="104" y="122" font-size="12" font-weight="bold" fill="#ffffff">注文</text>
  <text x="104" y="135" font-size="9" fill="#e2e8f0">Order</text>
  <text x="348" y="122" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="104" y="166" font-size="11" fill="#334155">注文 ID / 受付番号</text>
  <text x="104" y="188" font-size="11" fill="#334155">受け取り時間</text>
  <text x="104" y="212" font-size="11" font-weight="bold" fill="#166534">状態　← 区分値を 1 つ追加</text>

  <!-- shop context -->
  <rect x="490" y="70" width="330" height="180" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="506" y="92" font-size="11" font-weight="bold" fill="#64748b">shop（店舗）</text>

  <rect x="520" y="106" width="270" height="120" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="520" y="106" width="270" height="34" rx="6" fill="#94a3b8"/>
  <text x="534" y="122" font-size="12" font-weight="bold" fill="#ffffff">取扱状況</text>
  <text x="534" y="135" font-size="9" fill="#e2e8f0">ShopMenuStock</text>
  <text x="778" y="122" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="534" y="166" font-size="11" fill="#334155">店舗 ID / 商品 ID</text>
  <text x="534" y="190" font-size="11" fill="#334155">状態（提供可 / 売り切れ）</text>
  <text x="534" y="212" font-size="11" fill="#64748b">変更なし</text>

  <!-- tablet -->
  <rect x="330" y="290" width="220" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="440" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">店舗のタブレット</text>

  <path d="M400,288 L280,232" fill="none" stroke="#3b82f6" stroke-width="1.6"/>
  <path d="M480,288 L600,232" fill="none" stroke="#3b82f6" stroke-width="1.6"/>

  <!-- note -->
  <rect x="60" y="356" width="760" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="78" y="375" font-size="11" font-weight="bold" fill="#92400e">新しいエンティティも、新しい関連も作らない</text>
  <text x="78" y="392" font-size="11" fill="#92400e">1 つの画面が 2 つのコンテキストにまたがる。両者の間にデータ上の繋がりはなく、タブレットが両方を読み書きするだけ。</text>
</svg>
