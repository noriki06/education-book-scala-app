<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>

  <text x="430" y="26" text-anchor="middle" font-weight="bold" fill="#1e293b">UserRewardCard.state の遷移</text>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- start -->
  <circle cx="40" cy="120" r="7" fill="#7c3aed"/>
  <line x1="47" y1="120" x2="88" y2="120" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow1)"/>
  <text x="67" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">カード作成</text>

  <!-- IS_COLLECTING -->
  <rect x="90" y="80" width="190" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="185" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">収集中</text>
  <text x="185" y="132" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">IS_COLLECTING</text>

  <!-- IS_COLLECTING -> IS_FILLED -->
  <line x1="280" y1="120" x2="368" y2="120" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow1)"/>
  <text x="324" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">スタンプ件数＝必要数</text>

  <!-- IS_FILLED -->
  <rect x="370" y="80" width="190" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="465" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">特典獲得</text>
  <text x="465" y="132" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">IS_FILLED</text>

  <!-- IS_FILLED -> IS_USED -->
  <line x1="560" y1="120" x2="648" y2="120" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow1)"/>
  <text x="604" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">特典を交換</text>

  <!-- IS_USED -->
  <rect x="650" y="80" width="160" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="730" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">使用済み</text>
  <text x="730" y="132" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">IS_USED</text>

  <!-- IS_USED -> IS_FILLED (rollback, right-angle) -->
  <path d="M730,80 V38 H465 V78" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow1)"/>
  <text x="598" y="30" text-anchor="middle" font-size="11.5" fill="#64748b">特典利用の注文をキャンセル（差し戻し）</text>

  <!-- suspendedAt side note on IS_COLLECTING -->
  <line x1="185" y1="160" x2="185" y2="240" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="90" y="240" width="190" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="185" y="263" text-anchor="middle" font-size="11" fill="#64748b">付帯フラグ（状態ではない）</text>
  <text x="185" y="283" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#334155">suspendedAt = Some</text>
  <text x="185" y="303" text-anchor="middle" font-size="11" fill="#64748b">＝中断中</text>
  <text x="185" y="319" text-anchor="middle" font-size="11" fill="#64748b">（state は動かない）</text>

  <!-- IS_EXPIRED -->
  <rect x="610" y="350" width="200" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="710" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">期限切れ</text>
  <text x="710" y="402" text-anchor="middle" font-size="11" font-family="monospace" fill="#64748b">IS_EXPIRED</text>

  <!-- IS_COLLECTING -> IS_EXPIRED (right-angle, routed clear of the note box) -->
  <path d="M300,160 V375 H608" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow1)"/>
  <text x="308" y="265" font-size="11" fill="#64748b">expiredAt 超過</text>
  <text x="308" y="281" font-size="11" fill="#64748b">（日次バッチ）</text>

  <!-- IS_FILLED -> IS_EXPIRED (right-angle) -->
  <path d="M465,160 V407 H608" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow1)"/>
  <text x="473" y="340" font-size="11" fill="#64748b">expiredAt＋延長期間</text>
  <text x="473" y="356" font-size="11" fill="#64748b">超過（日次バッチ）</text>
</svg>
