<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b">ER 図 — スタンプまわりのデータの繋がり</text>

  <!-- ================= 会員 ================= -->
  <rect x="40" y="60" width="230" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="40" y="60" width="230" height="34" rx="6" fill="#94a3b8"/>
  <text x="54" y="76" font-size="12" font-weight="bold" fill="#ffffff">会員</text>
  <text x="54" y="89" font-size="9" fill="#e2e8f0">User</text>
  <text x="258" y="76" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="54" y="118" font-size="11" fill="#334155">会員 ID</text>
  <text x="54" y="138" font-size="11" fill="#334155">公開用識別子</text>

  <!-- ================= 店舗 ================= -->
  <rect x="40" y="230" width="230" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="40" y="230" width="230" height="34" rx="6" fill="#94a3b8"/>
  <text x="54" y="246" font-size="12" font-weight="bold" fill="#ffffff">店舗</text>
  <text x="54" y="259" font-size="9" fill="#e2e8f0">Shop</text>
  <text x="258" y="246" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="54" y="288" font-size="11" fill="#334155">店舗 ID</text>
  <text x="54" y="308" font-size="11" fill="#334155">店名</text>

  <!-- ================= 注文 ================= -->
  <rect x="40" y="390" width="230" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="40" y="390" width="230" height="34" rx="6" fill="#94a3b8"/>
  <text x="54" y="406" font-size="12" font-weight="bold" fill="#ffffff">注文</text>
  <text x="54" y="419" font-size="9" fill="#e2e8f0">Order</text>
  <text x="258" y="406" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="54" y="448" font-size="11" fill="#334155">注文 ID</text>
  <text x="54" y="468" font-size="11" fill="#334155">状態（受付 〜 受け渡し済み）</text>

  <!-- ================= スタンプカード ================= -->
  <rect x="450" y="60" width="300" height="160" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="450" y="60" width="300" height="34" rx="6" fill="#16a34a"/>
  <text x="464" y="76" font-size="12" font-weight="bold" fill="#ffffff">スタンプカード</text>
  <text x="464" y="89" font-size="9" fill="#dcfce7">StampCard</text>
  <text x="738" y="76" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="464" y="118" font-size="11" fill="#334155">スタンプカード ID</text>
  <text x="464" y="140" font-size="11" fill="#334155">会員 ID</text>
  <text x="464" y="162" font-size="11" fill="#334155">有効期限</text>
  <text x="464" y="184" font-size="11" fill="#334155">交換に使った注文 ID</text>
  <text x="464" y="206" font-size="11" fill="#334155">使用済み日時</text>

  <!-- ================= スタンプ ================= -->
  <rect x="450" y="270" width="300" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="450" y="270" width="300" height="34" rx="6" fill="#16a34a"/>
  <text x="464" y="286" font-size="12" font-weight="bold" fill="#ffffff">スタンプ</text>
  <text x="464" y="299" font-size="9" fill="#dcfce7">Stamp</text>
  <text x="738" y="286" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="464" y="328" font-size="11" fill="#334155">スタンプ ID</text>
  <text x="464" y="350" font-size="11" fill="#334155">スタンプカード ID</text>
  <text x="464" y="372" font-size="11" fill="#334155">注文 ID</text>
  <text x="464" y="394" font-size="11" fill="#334155">店舗 ID（付与日時は createdAt）</text>

  <!-- ================= relations ================= -->
  <path d="M270,104 H360 V118 H446" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="356" y="98" text-anchor="end" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>

  <path d="M600,220 V270" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="612" y="250" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>

  <path d="M270,274 H360 V394 H446" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="356" y="268" text-anchor="end" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>

  <path d="M270,434 H400 V372 H446" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="396" y="428" text-anchor="end" font-size="12" font-weight="bold" fill="#5b21b6">1 : 1</text>

  <!-- ================= 対象外 ================= -->
  <rect x="450" y="432" width="300" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="464" y="454" font-size="11" font-weight="bold" fill="#64748b">データを持たないもの</text>
  <text x="464" y="475" font-size="10.5" fill="#64748b">有効スタンプ数 … 件数を数えて求める</text>
  <text x="464" y="495" font-size="10.5" fill="#64748b">無料特典 … 有効スタンプが 10 個あるかで判定する</text>

  <!-- ================= note ================= -->
  <rect x="40" y="545" width="800" height="60" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="58" y="565" font-size="11" font-weight="bold" fill="#92400e">この図で確認するのは「どこに何があって、いくつ繋がるか」だけです</text>
  <text x="58" y="582" font-size="11" fill="#92400e">1 枚のカードにスタンプは 10 個まで。満杯・期限切れになると、次のスタンプは新しいカードに押されます。</text>
  <text x="58" y="599" font-size="11" fill="#92400e">有効期限も使用済み日時もカードが持つため、スタンプ 1 件ずつの失効は見ません。</text>
</svg>
