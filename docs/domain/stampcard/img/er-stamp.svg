<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="880" height="570" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b">ER 図 — スタンプまわりのデータの繋がり</text>

  <!-- ================= 会員 ================= -->
  <rect x="40" y="60" width="240" height="100" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="40" y="60" width="240" height="34" rx="6" fill="#94a3b8"/>
  <text x="54" y="76" font-size="12" font-weight="bold" fill="#ffffff">会員</text>
  <text x="54" y="89" font-size="9" fill="#e2e8f0">User</text>
  <text x="268" y="76" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="54" y="120" font-size="11" fill="#334155">会員 ID</text>
  <text x="54" y="142" font-size="11" fill="#334155">公開用識別子</text>

  <!-- ================= 店舗 ================= -->
  <rect x="40" y="210" width="240" height="100" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="40" y="210" width="240" height="34" rx="6" fill="#94a3b8"/>
  <text x="54" y="226" font-size="12" font-weight="bold" fill="#ffffff">店舗</text>
  <text x="54" y="239" font-size="9" fill="#e2e8f0">Shop</text>
  <text x="268" y="226" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="54" y="270" font-size="11" fill="#334155">店舗 ID</text>
  <text x="54" y="292" font-size="11" fill="#334155">店名</text>

  <!-- ================= 注文 ================= -->
  <rect x="40" y="360" width="240" height="100" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="40" y="360" width="240" height="34" rx="6" fill="#94a3b8"/>
  <text x="54" y="376" font-size="12" font-weight="bold" fill="#ffffff">注文</text>
  <text x="54" y="389" font-size="9" fill="#e2e8f0">Order</text>
  <text x="268" y="376" text-anchor="end" font-size="10" fill="#ffffff">既存</text>
  <text x="54" y="420" font-size="11" fill="#334155">注文 ID</text>
  <text x="54" y="442" font-size="11" fill="#334155">状態（受付 〜 受渡し / キャンセル）</text>

  <!-- ================= スタンプ ================= -->
  <rect x="500" y="150" width="300" height="210" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="500" y="150" width="300" height="34" rx="6" fill="#16a34a"/>
  <text x="514" y="166" font-size="12" font-weight="bold" fill="#ffffff">スタンプ</text>
  <text x="514" y="179" font-size="9" fill="#dcfce7">Stamp</text>
  <text x="788" y="166" text-anchor="end" font-size="10" fill="#ffffff">今回追加</text>
  <text x="514" y="210" font-size="11" fill="#334155">スタンプ ID</text>
  <text x="514" y="232" font-size="11" fill="#334155">会員 ID</text>
  <text x="514" y="254" font-size="11" fill="#334155">店舗 ID</text>
  <text x="514" y="276" font-size="11" fill="#334155">注文 ID</text>
  <text x="514" y="298" font-size="11" fill="#334155">状態（有効 / 無効）</text>
  <text x="514" y="320" font-size="11" fill="#334155">使用済み日時</text>
  <text x="514" y="342" font-size="11" fill="#334155">付与日</text>

  <!-- ================= relations ================= -->
  <path d="M280,110 H400 V225 H496" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="396" y="160" text-anchor="end" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>

  <path d="M280,260 H440 V265 H496" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="436" y="252" text-anchor="end" font-size="12" font-weight="bold" fill="#5b21b6">1 : *</text>

  <path d="M280,410 H400 V305 H496" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="396" y="360" text-anchor="end" font-size="12" font-weight="bold" fill="#5b21b6">1 : 1</text>

  <!-- ================= 対象外 ================= -->
  <rect x="500" y="390" width="300" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="514" y="412" font-size="11" font-weight="bold" fill="#64748b">データを持たないもの</text>
  <text x="514" y="432" font-size="10.5" fill="#64748b">スタンプカード … スタンプの集合を指す言葉</text>
  <text x="514" y="450" font-size="10.5" fill="#64748b">有効スタンプ数 … 件数を数えて求める</text>
  <text x="514" y="468" font-size="10.5" fill="#64748b">有効期限 / 無料特典 … 付与日と件数から判定する</text>

  <!-- ================= note ================= -->
  <rect x="40" y="510" width="800" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="58" y="529" font-size="11" font-weight="bold" fill="#92400e">この図で確認するのは「どこに何があって、いくつ繋がるか」だけです</text>
  <text x="58" y="546" font-size="11" fill="#92400e">状態が取る値、使用済み日時が必須か任意か、有効期限をどう判定するかは、このあとの EntityModel で定義します。</text>
</svg>
